[workspace]
members = ["framework", "msmith", "conversion"]
resolver = "2"

[workspace.dependencies]
framework = { path = "framework" }
msmith = { path = "msmith" }
conversion = { path = "conversion" }
once_cell = "1.19.0"
linkme = "0.3.29"
log = "0.4.22"
env_logger = "0.11.5"
arbitrary = { version = "1.3.2", features = ["derive"] }
rand = "0.8.5"
rand_distr = "0.4.3"
serde = { version = "1.0.207", features = ["derive"] }
serde_json = "1.0.127"
anyhow = "1.0.86"
