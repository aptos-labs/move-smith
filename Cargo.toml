[workspace.dependencies]
anyhow = "1.0.86"
num_cpus = "1.16.0"
arbitrary = { version = "1.3.2", features = ["derive"] }
clap = { version = "4.5.15", features = ["derive"] }
derive_builder = "0.20.0"
env_logger = "0.11.5"
indicatif = { version = "0.15.0", features = ["rayon"] }
log = "0.4.22"
num-bigint = "0.4.6"
once_cell = "1.19.0"
rand = "0.8.5"
rand_distr = "0.4.3"
rayon = "1.10.0"
regex = "1.10.6"
serde = { version = "1.0.207", features = ["derive"] }
tempfile = "3.12.0"
tokio = "1.39.2"
toml = "0.8.19"
serde_json = "1.0.127"
enuminto = { path = "enuminto" }
framework = { path = "framework" }

[workspace]
members = ["enuminto", "framework", "msmith"]
exclude = ["fuzz"]
