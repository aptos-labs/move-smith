[fuzz]
jobs = 32
cost_usd_limit = 3.0
generations = 100
features = [
    "data/feature_rust_with_embeddings.json",
    "data/feature_transactional_with_embeddings.json",
]
save_all_tests = false
save_all_compilable = true
fix_attempt_limit = 2
enable_static_fixer = true
enable_static_fixer_llm = true
enable_dynamic_fixer_hint = true
enable_feature_rewriter = true

[prompt]
generation_system = ["prompts/common_error_fix_short.md"]
generation_prefix = [
    "prompts/transactional_format.md",
    "prompts/move_example.md",
]
move_examples = ["prompts/move_examples"]
dynamic_error_fixes = ["prompts/dynamic_error_fixes"]
static_error_fixes = ["prompts/static_error_fixes"]
mutations = ["prompts/mutations"]

[fuzz.feature_combination]
init = 30           # Initial population size
mu = 200            # Population size
lam = 30            # Offspring size
tests_per_combo = 1

[fuzz.mutation]
mutation_rate = 0.5
combo_size_max = 10
cross_over_rate = 0.3

semantic_mutation_rate = 0.3
merge_mutation_rate = 0.3
list_mutation_rate = 0.3

[fuzz.feature]
init = 10
mu = 10             # Population size
lam = 10            # Offspring size
mutation_rate = 0.1

[models.default]
# name = "gpt-4.1-nano"
name = "gpt-4.1-mini"
# name = "gpt-4.1"
temperature = 0.8

[models.extract]
name = "gpt-4.1"
temperature = 0.5
